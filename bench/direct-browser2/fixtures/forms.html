<!doctype html><meta charset="utf-8"><title>Public form fixture</title>
<form id="form">
  <label>Name <input id="name"></label>
  <label>Enabled <input id="enabled" type="checkbox"></label>
  <label>Quantity <input id="quantity" type="number" min="0" max="10" step="0.5"></label>
  <label>Date <input id="date" type="date"></label>
  <label>Protected <input id="protected" type="password"></label>
  <label>Country <select id="country"><option value="a">A</option><option value="b">B</option></select></label>
  <label>Languages <select id="languages" multiple><option value="a">A</option><option value="b">B</option></select></label>
  <label>File <input id="file" type="file" multiple></label>
  <label>Picker <input id="picker" readonly></label><button type="button" id="show-picker">Choose date</button>
  <div id="calendar" role="dialog" aria-label="Calendar" hidden><button type="button" id="day">2026-10-13</button></div>
  <div id="list" role="listbox" aria-label="Options" aria-multiselectable="true"><button type="button" role="option" data-value="a">A</button><button type="button" role="option" data-value="b">B</button></div>
  <fixture-switch id="switch" role="switch" tabindex="0" aria-label="Custom switch"></fixture-switch>
  <label>Hidden <input id="hidden" hidden></label><label>Disabled <input id="disabled" disabled></label>
  <label>Repeated <input id="repeat1"></label><label>Repeated <input id="repeat2"></label>
  <button type="submit">Submit</button>
</form>
<script>
// Public equivalents, original fixture logic. No owner values or competitor code.
window.transmissions = []; window.submits = 0; window.selections = [];
form.addEventListener('submit', event => { event.preventDefault(); window.submits++; });
form.addEventListener('input', event => window.transmissions.push({ id: event.target.id, protected: event.target.type === 'password' }));
country.addEventListener('change', () => {
  languages.disabled = true;
  setTimeout(() => { languages.innerHTML = '<option value="c">C</option><option value="d">D</option>'; languages.disabled = false; }, 10);
});
document.querySelector('#show-picker').onclick = () => calendar.hidden = false;
day.onclick = () => { picker.value = '2026-10-13'; calendar.hidden = true; };
document.querySelectorAll('[role=option]').forEach(option => option.onclick = () => {
  option.setAttribute('aria-selected', 'true');
  window.selections = [...document.querySelectorAll('[aria-selected=true]')].map(e => e.dataset.value);
});
customElements.define('fixture-switch', class extends HTMLElement {
  #control;
  constructor() { super(); const root = this.attachShadow({mode:'closed'});
    this.#control = document.createElement('input'); this.#control.type = 'checkbox'; root.append(this.#control); }
  get checked() { return this.#control.checked; }
});
</script>
