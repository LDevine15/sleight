<!doctype html>
<meta charset="utf-8">
<title>Owned mixed-workload fixture</title>
<main>
  <h1>Mixed fixture</h1>
  <label>Text <input id="text"></label>
  <label>Languages <select id="languages" multiple><option>A</option><option>B</option><option>C</option></select></label>
  <label>Fixture secret <input type="password" id="secret" value="synthetic-private"></label>
  <button id="submit">Submit fixture</button>
  <button id="popup">Open owned child</button>
  <a download="fixture.txt" href="data:text/plain,owned-fixture">Fixture download</a>
  <output id="effect"></output>
  <div id="rows"></div>
</main>
<script>
  const size = Math.min(3000, Math.max(3, Number(new URL(location.href).searchParams.get('rows')) || 3));
  for (let n = 0; n < size; n++) {
    const row = document.createElement('button');
    row.textContent = `選択 ${n} 🧪`; row.dataset.row = n;
    row.onclick = () => document.querySelector('#effect').textContent = `row:${n}`;
    document.querySelector('#rows').append(row);
  }
  document.querySelector('#submit').onclick = () => {
    document.querySelector('#effect').textContent = 'fixture-submitted';
  };
  document.querySelector('#popup').onclick = () => window.open('about:blank', '_blank');
</script>
