<!doctype html>
<meta charset="utf-8">
<title>Owned world semantics fixture</title>
<div id="custom" role="switch" aria-checked="true">Page-defined switch</div>
<div id="closed"></div>
<input id="secret" type="password" aria-label="Protected input">
<div id="absent"></div><div id="throwing"></div><div id="slow"></div><div id="hostile"></div>
<script>
  Object.defineProperty(document.querySelector('#custom'), 'checked', { configurable: true, get: () => true });
  const root = document.querySelector('#closed').attachShadow({ mode: 'closed' });
  root.innerHTML = '<input id="closed-switch" type="checkbox" checked aria-label="Closed switch">';
  Object.defineProperty(document.querySelector('#throwing'), 'checked', { get() { throw Error('fixture-secret-error'); } });
  Object.defineProperty(document.querySelector('#slow'), 'checked', { get() {
    const until = performance.now() + 120; while (performance.now() < until) {} return true;
  } });
  Object.defineProperty(document.querySelector('#hostile'), 'checked', { get() { return { secret: 'fixture-secret-hostile' }; } });
</script>
