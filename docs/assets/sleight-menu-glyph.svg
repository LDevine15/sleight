<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 18" width="24" height="18">
  <!-- 4. Open glove whose wrist breaks into the painted square dabs, with the pointer at its fingertips (the icon's composition, one hand). -->
  <g fill="none" stroke="#000" stroke-width="2" stroke-linecap="round">
    <line x1="5"  y1="3.5" x2="5"  y2="10"/>
    <line x1="8"  y1="2"   x2="8"  y2="10"/>
    <line x1="11" y1="2.8" x2="11" y2="10"/>
    <line x1="14" y1="4.5" x2="14" y2="10"/>
    <line x1="5.5" y1="12.5" x2="1.8" y2="8.5"/>
  </g>
  <!-- palm tapering to the wrist -->
  <path fill="#000" d="M4 9 H15 V11 L14 13.5 H6 L5 11 Z"/>
  <!-- the wrist breaks into square dabs -->
  <rect x="6"    y="14.5" width="2"   height="2"   fill="#000"/>
  <rect x="9.5"  y="15"   width="2"   height="2"   fill="#000"/>
  <rect x="13"   y="14.5" width="2"   height="2"   fill="#000"/>
  <rect x="2.5"  y="16"   width="2"   height="2"   fill="#000"/>
  <!-- pointer at the fingertips (10x15 unit arrow scaled 0.7, tip at 16.5,1) -->
  <path fill="#000" d="M16.5 1 L16.5 9.75 L18.6 7.86 L20.4 11.22 L21.68 10.59 L19.95 7.44 L22.94 7.44 Z"/>
</svg>
