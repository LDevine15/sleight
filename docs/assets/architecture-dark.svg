<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1032 372" width="1032" height="372" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">How sleight works</title>
<desc id="desc">Your coding agent (Claude Code, Codex or Cursor) talks MCP to sleight. sleight's launcher runs on the Node inside the ChatGPT app, starts that app's computer-use engine and relays each call to it, and the engine clicks, types and drags in your Mac apps in the background. For Chrome and Helium, sleight forks its turbo worker, which drives the browser over the Chrome DevTools Protocol on 127.0.0.1, with the engine left out of that path.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#EFE9DC"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7299EA"/></marker><g id="glove"><g transform="translate(10 10) rotate(-35)"><path d="M-2 12.39 Q-2.2 10.8 -0.6 10.8 L12.4 10.8 Q14 10.8 13.82 12.39 L13.48 15.41 Q13.3 17 12.56 18.42 L11.94 19.58 Q11.2 21 9.6 21 L5.2 21 Q3.6 21 2.35 20 L-0.15 18 Q-1.4 17 -1.6 15.41 Z" fill="#B9BFC9"/><path d="M-2.02 12.19 Q-2.2 10.8 -0.8 10.8 L10 10.8 Q11.4 10.8 11.24 12.19 L10.86 15.61 Q10.7 17 9.89 18.14 L9.81 18.26 Q9 19.4 7.6 19.4 L5 19.4 Q3.6 19.4 2.34 18.79 L-0.14 17.61 Q-1.4 17 -1.58 15.61 Z" fill="#EFE9DC"/><path d="M-3.8 14.6 A2.5 3.3 0 1 0 1.2 14.6 A2.5 3.3 0 1 0 -3.8 14.6 Z" fill="#B9BFC9"/><path d="M-4 14 A2 2.8 0 1 0 0 14 A2 2.8 0 1 0 -4 14 Z" fill="#EFE9DC"/><path d="M0.83 13.52 L-5.04 7.13 A1.25 1.25 0 0 0 -6.93 8.76 L-1.43 15.48 Z" fill="#B9BFC9"/><path d="M0.83 13.51 L-5.21 6.91 A0.78 0.78 0 0 0 -6.38 7.93 L-0.57 14.74 Z" fill="#EFE9DC"/><path d="M2.44 11.48 L1.3 1.09 A1.2 1.2 0 0 0 -1.09 1.3 L-0.44 11.72 Z" fill="#B9BFC9"/><path d="M1.35 11.58 L0.36 0.91 A0.74 0.74 0 0 0 -1.12 1.03 L-0.45 11.72 Z" fill="#EFE9DC"/><path d="M6.15 11.51 L5.17 -0.67 A1.2 1.2 0 0 0 2.77 -0.53 L3.25 11.69 Z" fill="#B9BFC9"/><path d="M5.05 11.59 L4.24 -0.88 A0.74 0.74 0 0 0 2.75 -0.8 L3.25 11.68 Z" fill="#EFE9DC"/><path d="M9.85 11.59 L9.51 0.29 A1.2 1.2 0 0 0 7.11 0.31 L6.95 11.61 Z" fill="#B9BFC9"/><path d="M8.75 11.6 L8.59 0.04 A0.74 0.74 0 0 0 7.1 0.04 L6.95 11.6 Z" fill="#EFE9DC"/><path d="M13.5 11.68 L13.68 3.81 A1.15 1.15 0 0 0 11.39 3.68 L10.7 11.52 Z" fill="#B9BFC9"/><path d="M12.43 11.63 L12.82 3.52 A0.71 0.71 0 0 0 11.39 3.42 L10.7 11.51 Z" fill="#EFE9DC"/></g></g><g id="dabs-blue"><g transform="translate(10 10) rotate(-35)"><rect x="-1.6" y="-1.6" width="3.2" height="3.2" rx="0.51" fill="#4E79D9" transform="translate(4.2 23) rotate(8)"/><rect x="-1.5" y="-1.5" width="3" height="3" rx="0.48" fill="#7299EA" transform="translate(8.8 23.5) rotate(-6)"/><rect x="-1.4" y="-1.4" width="2.8" height="2.8" rx="0.45" fill="#7299EA" transform="translate(6.5 26.5) rotate(4)"/><rect x="-1.3" y="-1.3" width="2.6" height="2.6" rx="0.42" fill="#A9C4F5" transform="translate(11.5 26.2) rotate(-11)"/><rect x="-1.1" y="-1.1" width="2.2" height="2.2" rx="0.35" fill="#A9C4F5" transform="translate(2.6 27.5) rotate(-4)"/><rect x="-1.1" y="-1.1" width="2.2" height="2.2" rx="0.35" fill="#7299EA" transform="translate(9.2 29.6) rotate(7)"/><rect x="-0.9" y="-0.9" width="1.8" height="1.8" rx="0.29" fill="#A9C4F5" transform="translate(13.9 29.2) rotate(3)"/><rect x="-0.8" y="-0.8" width="1.6" height="1.6" rx="0.26" fill="#A9C4F5" transform="translate(5.6 30.6) rotate(-8)"/></g></g><g id="dabs-ember"><g transform="translate(10 10) rotate(-35)"><rect x="-1.6" y="-1.6" width="3.2" height="3.2" rx="0.51" fill="#E8622C" transform="translate(4.2 23) rotate(8)"/><rect x="-1.5" y="-1.5" width="3" height="3" rx="0.48" fill="#EE8450" transform="translate(8.8 23.5) rotate(-6)"/><rect x="-1.4" y="-1.4" width="2.8" height="2.8" rx="0.45" fill="#EE8450" transform="translate(6.5 26.5) rotate(4)"/><rect x="-1.3" y="-1.3" width="2.6" height="2.6" rx="0.42" fill="#F6B48C" transform="translate(11.5 26.2) rotate(-11)"/><rect x="-1.1" y="-1.1" width="2.2" height="2.2" rx="0.35" fill="#F6B48C" transform="translate(2.6 27.5) rotate(-4)"/><rect x="-1.1" y="-1.1" width="2.2" height="2.2" rx="0.35" fill="#EE8450" transform="translate(9.2 29.6) rotate(7)"/><rect x="-0.9" y="-0.9" width="1.8" height="1.8" rx="0.29" fill="#F6B48C" transform="translate(13.9 29.2) rotate(3)"/><rect x="-0.8" y="-0.8" width="1.6" height="1.6" rx="0.26" fill="#F6B48C" transform="translate(5.6 30.6) rotate(-8)"/></g></g><g id="mark"><g transform="translate(-18.4 19.4) translate(48 0) scale(-0.62 0.62)"><use href="#dabs-ember"/><use href="#glove"/></g><g transform="rotate(180 24 24) translate(-18.4 19.4) translate(48 0) scale(-0.62 0.62)"><use href="#dabs-blue"/><use href="#glove"/></g></g></defs>
<rect width="1032" height="372" fill="#141A26"/>
<rect x="20" y="24" width="140" height="180" rx="10" fill="#1C2331" stroke="#3A4456" stroke-width="1"/>
<text x="34" y="54" font-size="14" font-weight="700" fill="#EFE9DC">Coding agent</text>
<text x="34" y="84" font-size="13" fill="#EFE9DC">Claude Code</text><text x="34" y="104" font-size="13" fill="#EFE9DC">Codex</text><text x="34" y="124" font-size="13" fill="#EFE9DC">Cursor</text>
<rect x="256" y="24" width="220" height="180" rx="10" fill="#1C2331" stroke="#E8622C" stroke-width="2"/>
<text x="270" y="56" font-size="17" font-weight="700" fill="#EFE9DC">sleight</text>
<g transform="translate(416 34)"><rect width="46" height="46" rx="10" fill="#0E131C" stroke="#3A4456"/><use href="#mark" transform="translate(1 1) scale(0.917)"/></g>
<text x="270" y="96" font-size="13" font-weight="700" fill="#EFE9DC">launcher</text>
<text x="270" y="112" font-size="13" fill="#B9BFC9">runs on ChatGPT’s own Node</text>
<text x="270" y="138" font-size="13" font-weight="700" fill="#EFE9DC">relay</text>
<text x="270" y="154" font-size="13" fill="#B9BFC9">approvals, turn ids, rules</text>
<text x="270" y="180" font-size="13" font-weight="700" fill="#EFE9DC">mod</text>
<text x="270" y="196" font-size="13" fill="#B9BFC9">ends each engine turn</text>
<rect x="572" y="24" width="190" height="180" rx="10" fill="#1C2331" stroke="#3A4456" stroke-width="1"/>
<text x="586" y="54" font-size="14" font-weight="700" fill="#EFE9DC">ChatGPT app’s</text>
<text x="586" y="72" font-size="14" font-weight="700" fill="#EFE9DC">computer-use engine</text>
<text x="586" y="104" font-size="13" fill="#B9BFC9">cua_repl server and</text><text x="586" y="120" font-size="13" fill="#B9BFC9">its native helper</text>
<text x="586" y="152" font-size="13" fill="#B9BFC9">newest version, found</text><text x="586" y="168" font-size="13" fill="#B9BFC9">at each launch</text>
<rect x="862" y="24" width="150" height="180" rx="10" fill="#1C2331" stroke="#3A4456" stroke-width="1"/>
<text x="876" y="54" font-size="14" font-weight="700" fill="#EFE9DC">Your Mac apps</text>
<text x="876" y="84" font-size="13" fill="#EFE9DC">native apps</text><text x="876" y="104" font-size="13" fill="#EFE9DC">Safari, Firefox</text><text x="876" y="124" font-size="13" fill="#EFE9DC">Electron apps</text>
<line x1="160" y1="114" x2="250" y2="114" stroke="#EFE9DC" stroke-width="1.6" marker-end="url(#a)"/>
<text x="208" y="90" font-size="13" fill="#B9BFC9" text-anchor="middle">MCP</text><text x="208" y="105" font-size="13" fill="#B9BFC9" text-anchor="middle">over stdio</text>
<line x1="476" y1="114" x2="566" y2="114" stroke="#EFE9DC" stroke-width="1.6" marker-end="url(#a)"/>
<text x="524" y="90" font-size="13" fill="#B9BFC9" text-anchor="middle">starts it and</text><text x="524" y="105" font-size="13" fill="#B9BFC9" text-anchor="middle">relays calls</text>
<line x1="762" y1="114" x2="856" y2="114" stroke="#EFE9DC" stroke-width="1.6" marker-end="url(#a)"/>
<text x="812" y="75" font-size="13" fill="#B9BFC9" text-anchor="middle">clicks, keys,</text><text x="812" y="90" font-size="13" fill="#B9BFC9" text-anchor="middle">drags, in the</text><text x="812" y="105" font-size="13" fill="#B9BFC9" text-anchor="middle">background</text>
<line x1="366" y1="204" x2="366" y2="262" stroke="#7299EA" stroke-width="1.6" marker-end="url(#b)"/>
<text x="376" y="240" font-size="13" fill="#B9BFC9">forks a worker</text>
<rect x="256" y="268" width="220" height="80" rx="10" fill="#1C2331" stroke="#7299EA" stroke-width="2"/>
<text x="270" y="298" font-size="13" font-weight="700" fill="#EFE9DC">turbo</text>
<text x="270" y="318" font-size="13" fill="#B9BFC9">Playwright over CDP,</text><text x="270" y="334" font-size="13" fill="#B9BFC9">on by default</text>
<line x1="476" y1="308" x2="856" y2="308" stroke="#7299EA" stroke-width="1.6" marker-end="url(#b)"/>
<text x="666" y="298" font-size="13" fill="#B9BFC9" text-anchor="middle">Chrome DevTools Protocol on 127.0.0.1</text>
<text x="666" y="328" font-size="13" fill="#B9BFC9" text-anchor="middle">the engine is not on this path</text>
<rect x="862" y="268" width="150" height="80" rx="10" fill="#1C2331" stroke="#7299EA" stroke-width="2"/>
<text x="876" y="298" font-size="13" font-weight="700" fill="#EFE9DC">Chrome, Helium</text>
<text x="876" y="318" font-size="13" fill="#B9BFC9">after a one-time</text><text x="876" y="334" font-size="13" fill="#B9BFC9">debugging switch</text>
</svg>
